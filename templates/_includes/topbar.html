{# Top bar — company name, role badge, logout (SRS §4.1). Hidden items are UX only, never access control (FR-USR-004). #}
<header>
  <span>TCMS</span>
  {% if user.is_authenticated %}
    <span>{{ user.username }}</span>
    <form method="post" action="{% url 'accounts:logout' %}">
      {% csrf_token %}
      <button type="submit">Logout</button>
    </form>
  {% endif %}
</header>
